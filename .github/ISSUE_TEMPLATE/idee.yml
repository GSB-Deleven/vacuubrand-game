name: 💡 Idee / neue Funktion
description: Ein Vorschlag, der umgesetzt werden soll.
title: "Idee: "
labels: [idee]
body:
  - type: textarea
    id: idee
    attributes:
      label: Was soll es geben?
      placeholder: z. B. "Zwischen den Laboren eine kurze Quizfrage mit Bonuszeit."
    validations:
      required: true
  - type: textarea
    id: warum
    attributes:
      label: Warum? Was bringt es am Stand?
  - type: dropdown
    id: prio
    attributes:
      label: Wie wichtig?
      options: [Muss vor der Messe, Wäre schön, Irgendwann]
  - type: markdown
    attributes:
      value: "Tipp: Schreib **@claude** in den Text, dann versucht Claude die Idee direkt umzusetzen und macht einen Pull Request."
