# Claude arbeitet an Issues und Pull Requests mit, sobald jemand mit Schreibrechten
#  - in einem Issue oder Kommentar "@claude" schreibt, oder
#  - einem Issue das Label "claude" gibt.
# Claude antwortet im Issue, setzt die Änderung auf einem eigenen Branch um und bereitet einen Pull Request vor.
# Einmalig nötig: Secret CLAUDE_CODE_OAUTH_TOKEN (Claude-Abo) oder ANTHROPIC_API_KEY anlegen,
# siehe Wiki-Seite "Mitarbeit & Planung".
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude') || github.event.label.name == 'claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
